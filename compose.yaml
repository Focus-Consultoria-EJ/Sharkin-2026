name: sharkin

services:
  ui:
    container_name: sharkin_ui
    build:
      context: ./ui
    ports:
      - "${UI_PORT}:${UI_PORT}"
    environment:
      NODE_ENV: production
      PORT: ${UI_PORT}
    restart: unless-stopped
    depends_on:
      - services

  services:
    container_name: sharkin_services
    build:
      context: ./services
    ports:
      - "${SERVICES_PORT}:${SERVICES_PORT}"
    environment:
      NODE_ENV: production
      PORT: ${SERVICES_PORT}
    restart: unless-stopped
    depends_on:
      - postgres

  postgres:
    container_name: sharkin_db
    image: postgres:17
    volumes:
      - postgres_volume:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    environment:
      POSTGRES_DB: sharkin_database
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped

volumes:
  postgres_volume:
